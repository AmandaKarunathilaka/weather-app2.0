<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Weather App</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
        
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    </head>
    <body>
        <div class="toggles">
            <label class="switch">
                <input type="checkbox" id="theme-toggle">
                <span class="slider"></span>
            </label>
        
            <select id="language-toggle">
                <option value="en">EN</option>
                <option value="ja">日本語</option>
            </select>
        </div>
        
        <div class="wrapper">
            <div class="main">
                <input type="text" placeholder="Search City" id="search-input">
                <button id="search-btn"><i class="fa fa-search" aria-hidden="true"></i></button>
            </div>
            <div class="error" id="error-msg">
                <p>Invalid City Name. <br>Please enter correct city name.</p>
            </div>
                <div class="weather">
                    <img src="night.png" class="weather-icon">
                    <h1 class="temp">30°C</h1>
                    <h2 class="city" id="city-name">Panadura</h2>
                
                    <div class="details">
                        <div class="col1">
                            <img src="humidity.png" >
                            <p class="humidity">74%</p>
                            <p class="humidity-label">Humidity</p>
                        </div>

                        <div class="col1">
                            <img src="wind.png" >
                            <p class="wind">17 km/h</p>
                            <p class="wind-label">Wind Speed</p>
                        </div>

                        <div class="col1">
                            <img src="visi.png" >
                            <p class="visibility">10000km</p>
                            <p class="visibility-label">Visibility</p>
                        </div>
                    </div>
                </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
